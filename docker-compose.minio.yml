# Bundled MinIO for the raw request archive. Layer it on like docker-compose.postgres.yml:
#
#   docker compose -f docker-compose.yaml -f docker-compose.postgres.yml -f docker-compose.minio.yml up -d
#
# Set ARCHIVE_ENABLED=true, ARCHIVE_S3_ENDPOINT_URL=http://minio:9000, and ARCHIVE_S3_ACCESS_KEY_ID /
# ARCHIVE_S3_SECRET_ACCESS_KEY in .env; those keys double as the MinIO root credentials.
# Not published on the host: only the backend containers reach it.

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: claude-code-proxy-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ARCHIVE_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${ARCHIVE_S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the archive bucket if missing.
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing \"local/$$BUCKET\""]
    environment:
      MINIO_ROOT_USER: ${ARCHIVE_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${ARCHIVE_S3_SECRET_ACCESS_KEY}
      BUCKET: ${ARCHIVE_S3_BUCKET:-cc-proxy}
    depends_on:
      minio:
        condition: service_healthy

  backend:
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
